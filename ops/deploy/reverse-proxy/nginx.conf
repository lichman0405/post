# =============================================================================
# POST staging — TLS reverse proxy (nginx), mounted as
# /etc/nginx/conf.d/default.conf by ops/deploy/docker-compose.staging.yml
# =============================================================================
#
# This file is the only way into a staging deployment. Everything else in the
# stack (API, worker, MCP, adapter, PostgreSQL, Redis, MinIO, Gitea) is
# reachable on the compose network and publishes nothing: the proxy service is
# the only one with a `ports:` block, and the template validator refuses a
# stack where that stops being true.
#
# It is mounted as a plain .conf on purpose, NOT through the nginx image's
# /etc/nginx/templates/*.template mechanism. That mechanism runs envsubst over
# the file, which rewrites nginx's own variables — $host, $remote_addr,
# $proxy_add_x_forwarded_for — into empty strings unless NGINX_ENVSUBST_FILTER
# is narrowed. A config that needs no substitution cannot be broken by it, and
# this one needs none: the certificate is whatever the operator mounts, and
# server_name is a catch-all.
#
# What is deliberately NOT here: certificate issuance. Certificates and keys
# arrive from outside (a managed certificate, certbot, or the platform's
# secret store) and are mounted read-only at /etc/nginx/tls. The
# /.well-known/acme-challenge/ location below is the one hook an http-01
# issuance needs — it serves from a shared volume nobody writes to by
# accident; DNS-01 or a managed certificate needs nothing at all.
# =============================================================================

# Docker's embedded DNS. Names resolved by the `resolver` directive are re-
# resolved as their TTL expires, which is the point: `proxy_pass http://api:8080`
# with a literal hostname resolves ONCE at startup and keeps that IP forever,
# so redeploying the API (`up -d --no-deps api`, the runbook's rollback step)
# leaves the proxy dialling a dead container until somebody restarts it. With
# the variables below, the 10s TTL is the worst case for a stale address.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP: nothing is served here, everything moves to TLS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Reads are harmless and this is the one path that must not redirect:
    # an ACME http-01 client cannot follow a redirect to a certificate it is
    # trying to obtain.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: the deployment's whole surface.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Mounted from ${POST_TLS_DIR}. The filename pair is part of the contract
    # with the operator — the validator reads these two paths and requires the
    # compose file to mount that directory read-only at /etc/nginx/tls, so a
    # path that changes on one side and not the other is a finding rather than
    # an nginx that starts and serves nothing.
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    # TLS 1.0/1.1 are not offered: both are deprecated and neither is needed
    # by any current client (CLAUDE.md §10's baseline is a modern browser).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    # Session tickets without key rotation are a forward-secrecy hole; the
    # session cache above is the part worth keeping.
    ssl_session_tickets off;

    # The browser is told to stay on https for a year. This is why staging
    # runs POST_ENV=prod: the API's session cookie is `Secure` in the prod
    # layer only (cmd/api/authhttp/auth_middleware.go:320), so a deployment
    # served over plain http would silently drop the login cookie.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Version disclosure off. Not a control on its own; there is no reason to
    # hand out the build number.
    server_tokens off;

    # Above every limit the API enforces on itself (the largest is 1 MiB,
    # cmd/api/assetshttp/publish.go:195), so a body that is genuinely too big
    # for an endpoint gets the API's own JSON error rather than an nginx HTML
    # 413 that a client cannot parse. Bounded rather than unlimited so the
    # proxy cannot be made to buffer arbitrary amounts of memory.
    client_max_body_size 8m;
    client_body_timeout 30s;

    # Timeouts sized for a server-rendered page that calls the API and the
    # adapter, not for a long-lived stream.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # From here on the client's address is the proxy's, unless the headers
    # below are set. X-Forwarded-* are what every downstream reader expects;
    # POST_WEB_ORIGIN is what the API's CORS and cookie policy actually use.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # The API. Its routes are all under /api/v1/..., so the original URI is
    # forwarded unchanged — with proxy_pass on a VARIABLE there is no
    # prefix-rewriting, which is what makes this one line correct for both
    # upstreams without a second location.
    location /api/ {
        set $post_api http://api:8080;
        proxy_pass $post_api;
    }

    # Health, readiness and the correlation-id'ed JSON the status page reads
    # are API endpoints too; a browser is allowed to call them unauthenticated.
    location = /healthz {
        set $post_api_healthz http://api:8080;
        proxy_pass $post_api_healthz;
    }
    location = /readyz {
        set $post_api_readyz http://api:8080;
        proxy_pass $post_api_readyz;
    }

    # Everything else is the web app (apps/web/app). It is not a backend: the
    # Next process renders and calls the API server-side, so the browser only
    # ever talks to this origin.
    location / {
        set $post_web http://web:3000;
        proxy_pass $post_web;
    }

    # Anyone who reaches this listener and asks for something the two upstreams
    # do not own gets the API's or the web app's own 404: /healthz-proxy is
    # NOT served here on purpose. The proxy's own liveness endpoint lives on a
    # loopback-only listener in the next block, so it is off the public
    # surface entirely rather than special-cased on it.
}

# The proxy's liveness endpoint: loopback inside the container, port 8081,
# never published (the compose file maps no port to it). This is what the
# compose healthcheck reads. It must not depend on the public hostname
# resolving, on a certificate being trusted, or on an upstream being up,
# because none of those are what "the proxy process is running" means.
# A static 200 answers exactly one question — is nginx serving — which is all
# the healthcheck claims. Whether the upstreams answer is the runbook's smoke
# step, from outside the deployment.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;

    location = /healthz-proxy {
        default_type "text/plain";
        return 200 "proxy ok\n";
    }

    location / {
        return 404;
    }
}
