# mypy config for the scientific adapter type gate (T0008, CI stage
# "python", make type-python). Lives here — not in the adapter project —
# for the same reason as ruff.toml. Keep in sync with scripts/ci.sh and
# .github/workflows/ci.yml.
[mypy]
python_version = 3.12

# Baseline exception for pre-existing adapter code (follow-up issue):
# HealthHandler._json expects dict[str, object] and health_payload returns
# dict[str, str] — dict is invariant, so mypy correctly rejects the call.
# Narrow the parameter type (e.g. Mapping[str, object]) in app.py, then
# drop this override. ignore_errors (not disable_error_code) because
# per-module disable_error_code crashes mypy 2.3.1.
[mypy-post_scientific_adapter.app]
ignore_errors = True
