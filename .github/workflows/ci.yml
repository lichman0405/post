# ci — POST CI baseline (T0008). One job per stage; a failing stage is
# identified by its job/step name in the PR check summary. Local replica:
# scripts/ci.sh (keep the stage lists in sync).
#
# All jobs run on ubuntu-24.04 (docs/25, docs/64: CI runner aligned with
# the canonical dev environment). Four of them need real infrastructure and
# say why in their own comments — migration-integration, a11y and i18n each
# declare a PostgreSQL service container, observability pulls the pinned
# pgvector image. The rest pass on a bare runner.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Stage 1 — spec bundle + task DAG validation (supersedes the former
  # spec-validation workflow, steps kept verbatim).
  spec-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (YAML spec parsing)
        run: pip install pyyaml
      - name: Validate machine-readable specs and task DAG
        run: python3 scripts/validate_specs.py
      - name: Canonical schema snapshot is the ordered migrations
        run: python3 scripts/gen_schema_snapshot.py --check
      - name: The snapshot drift check can itself report drift
        run: bash scripts/tests/schema-snapshot-test.sh
      - name: Verify derived spec version marker
        run: python3 scripts/spec_version.py --check
      - name: OpenAPI contract check (parse + $ref integrity + structure)
        run: python3 scripts/validate_openapi.py
      - name: OpenAPI contract fixture unit tests
        run: bash scripts/tests/openapi-unit-test.sh
      - name: Spec validation unit tests (fixture-driven, no network)
        run: bash scripts/tests/spec-validation-unit-test.sh
      - name: Source repository remote smoke test (real git remote capture)
        run: bash scripts/tests/spec-validation-smoke-test.sh

  # Stage 2 — task DAG/state/test-registry coverage and shape (T0008 fix 2:
  # the T0013 drift class, where a DAG task had no task_status entry).
  task-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DAG/state/test coverage + task_status/tests JSON shape
        run: python3 scripts/validate_task_state.py
      - name: Task-state validator fixture unit tests
        run: bash scripts/tests/task-state-unit-test.sh
      - name: Progress-view helper fixture tests
        run: bash scripts/tests/progress-update-test.sh
      # The ledger tools write tests.json, which T1206's acceptance criterion
      # reads. Their safety rule -- never record `passed` for an entry whose
      # task is not merged, and never for one they cannot point at -- is a
      # refusal rule, so it is tested with fixtures that try to break it.
      - name: tests.json ledger tool unit tests
        run: bash scripts/tests/tests-ledger-unit-test.sh

  # Stage 3 — Go: fmt / vet / staticcheck / unit (no database).
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: "go: fmt check"
        run: make fmt-check
      - name: "go: vet"
        run: go vet ./...
      - name: "go: staticcheck (pinned, baseline via ops/ci/staticcheck-baseline.txt)"
        run: make staticcheck
      - name: "go: staticcheck gate fixture unit tests"
        run: bash scripts/tests/staticcheck-unit-test.sh
      - name: "go: unit tests (integration package excluded — it needs PostgreSQL)"
        run: go test $(go list ./... | grep -v '/tests/integration')

  # Stage 4 — Web: lint / typecheck / unit / production build.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: "web: install (pnpm via corepack, frozen lockfile)"
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: "web: typecheck @post/ui"
        run: pnpm --filter @post/ui typecheck
      - name: "web: typecheck @post/web"
        run: pnpm --filter @post/web typecheck
      - name: "web: lint"
        run: pnpm --filter @post/web lint
      - name: "web: unit tests (every apps/web/lib/*.test.mjs, no-match guard)"
        run: bash scripts/web-unit-tests.sh
      - name: "web: production build (Next requires POST_ENV=prod at build)"
        env:
          POST_ENV: prod
          API_BASE_URL: http://127.0.0.1:18080
          SCIENTIFIC_ADAPTER_URL: http://127.0.0.1:19100
        run: pnpm --filter @post/web build

  # The gate machinery's own e2e. Nothing ran these until now, and one of them
  # rotted the moment a bug it had ENCODED was fixed: rejection-retry asserted
  # that a rework passes --session-id equal to --resume, which real claude
  # refuses outright. A suite that enforces everything else has to be enforced
  # itself. Self-contained: scratch repos, a fake claude, a fake gh.
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: "acceptance: the four-gate loop (collect, accept, PR) is executable"
        run: bash tests/acceptance/four-gate-e2e.sh
      - name: "acceptance: rejection and retry (rework resumes, respawn resets)"
        run: bash tests/acceptance/rejection-retry-e2e.sh
      - name: "acceptance: Supervisor git control (four gates before any gh call)"
        run: bash tests/acceptance/supervisor-git-e2e.sh
      - name: "acceptance: the driver outlives the turn that started it"
        run: bash tests/acceptance/driver-persistence-e2e.sh
      - name: "acceptance: a gate cannot grade a tree it changed or failed to measure"
        run: bash scripts/tests/gitea-e2e-guard-unit-test.sh
      # The phase-boundary checkpoint had the defect this job was created to fix,
      # one step further along: it was written for the 2026-09-13 hardening and
      # then invoked by nothing, which is how its step 7 came to name a script
      # the tree had long since replaced. Nothing noticed, because a file nobody
      # runs does not fail.
      #
      # The marker is what its step 6 reads: that step asks that the acceptance
      # e2e be exercised, and this job is already running every one of them just
      # above. Without the marker the checkpoint would run `scripts/ci.sh
      # acceptance` and with it this whole stage again.
      #
      # One of its items needs PostgreSQL and Redis, and says so rather than
      # inventing an answer (this job is a bare runner by design — see the header
      # above). The RSG gate is a G3 job that rddev runs with the dev stack; the
      # checkpoint asserts the wiring, which is checkable anywhere, and reports
      # the behavioural half as NOT ASKED. Read its output, not only its exit
      # code: a green here means every other item ran.
      - name: "acceptance: the phase-boundary checkpoint (the five structural defects, re-checked)"
        run: POST_INSIDE_ACCEPTANCE_STAGE=1 bash tests/acceptance/phase-boundary-checkpoint.sh

  # Stage 5 — Python: lint / type / pytest (configs: ops/ci/ruff.toml,
  # ops/ci/mypy.ini).
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "python: toolchain (uv, ruff, mypy)"
        run: pip install uv==0.12.13 ruff mypy
      - name: "python: sync adapter env"
        run: cd services/scientific-adapter && uv sync --frozen
      - name: "python: lint (ruff)"
        run: cd services/scientific-adapter && ruff check . --config ../../ops/ci/ruff.toml
      - name: "python: type (mypy)"
        run: cd services/scientific-adapter && mypy --config-file ../../ops/ci/mypy.ini src/post_scientific_adapter
      - name: "python: pytest"
        run: cd services/scientific-adapter && uv run pytest -q

  # Stage 6 — migration + integration against real PostgreSQL. The only
  # infrastructure-requiring stage; it is a separate job (and uses a
  # dedicated service container) so it stays separable from the bare-runner
  # stages above. Service image matches docker-compose.yml
  # (pgvector/pgvector:0.8.6-pg16, docs/66).
  migration-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pw
          POSTGRES_DB: post
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: "integration: pg-ready probe (proves reachability, not just an open port)"
        env:
          POSTGRES_TEST_ADMIN_URL: postgres://postgres:postgres_dev_pw@127.0.0.1:5432/post
        run: bash scripts/tests/pg-ready-unit-test.sh
      - name: "integration: install the pinned sqlc (drift_test.go self-skips without it)"
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          test "$(sqlc version | tr -d '[:space:]')" = "v1.31.1"
      - name: "integration: migrations + data-access suite (make test-integration)"
        env:
          POSTGRES_TEST_ADMIN_URL: postgres://postgres:postgres_dev_pw@127.0.0.1:5432/post
        run: make test-integration

  # Stage 7 — observability (T1109). The suite is self-contained by design:
  # the metrics harness starts its OWN PostgreSQL container and an in-process
  # devredis on free ports, and the trace harness starts its own API, worker
  # and scientific adapter. So this job needs no service container and no
  # docker compose. It does need the three toolchains the other stages already
  # install, because the trace half really does build and run @post/web and the
  # scientific adapter:
  #   * the pgvector image must already be present locally — the harness
  #     refuses to substitute another image, so it is pulled here explicitly
  #     (the migration job gets it as a service container instead);
  #   * the web phase runs `pnpm --filter @post/web build` and `next start`.
  # Wall clock: the metrics harness's 29-scrape 15s grid is real time, 7m26s on
  # a warm machine; 30 minutes is the honest ceiling on a cold runner.
  #
  # It is required from this first run, not staged: the gate spec's own
  # invariant (gate_spec_test.go's two-rules loop) reads every job defined
  # there and not in required_jobs as a G3 job that must name the tasks whose
  # work it asserts, so "wired but not yet required" is not a state this spec
  # can express. Its green is therefore established by running it, which is
  # what this job does on every push to main and every PR.
  observability:
    runs-on: ubuntu-24.04
    needs: [go]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: "observability: web deps (the trace phase builds and starts @post/web)"
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "observability: adapter env (the trace phase starts the scientific adapter)"
        run: pip install uv==0.12.13 && cd services/scientific-adapter && uv sync --frozen
      - name: "observability: pull the pinned pgvector image (the harness requires it locally and substitutes nothing)"
        run: docker pull pgvector/pgvector:0.8.6-pg16
      - name: "observability: metrics + alerts + distributed-trace suite (make observability-smoke)"
        run: make observability-smoke

  # Stage 8 — accessibility (T1104). The suite is not a static checker: it
  # builds @post/web for production, starts the real API harness against a real
  # PostgreSQL, and drives a real Chromium over every docs/42 core page that has
  # a route — asserting that axe-core's WCAG pass AND its best-practice pass are
  # both at zero AND that each dynamic page rendered the fixture's content
  # rather than its not-found shell.
  #
  # It needs Go (the harness is a Go program), node + pnpm (next build) and a
  # PostgreSQL. It does NOT need a step that installs the smoke suite's own
  # dependencies or Chromium: run-a11y.sh does both itself (npm ci against
  # tests/web-smoke/package-lock.json, then `npx playwright install
  # chromium --only-shell`, run-a11y.sh:73-78), so the browser version and the
  # lockfile stay the suite's business rather than this file's.
  #
  # Wall clock, measured locally: `next build` ~40 s, the suite itself 21-22 s;
  # the browser download is the variable part. It runs alongside the other jobs
  # rather than after them.
  a11y:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pw
          POSTGRES_DB: post
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: "a11y: web workspace deps (pnpm via corepack, frozen lockfile)"
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: "a11y: WCAG 2.2 AA suite (axe-core both passes + keyboard walk)"
        env:
          POSTGRES_TEST_ADMIN_URL: postgres://postgres:postgres_dev_pw@127.0.0.1:5432/post
          # The suite's ports are fixed and run-a11y.sh pre-flights them,
          # refusing to start on a busy one. An empty CI runner has nothing
          # there, but G2 re-runs these exact steps on a developer host, where a
          # Worker may be driving the same suite on the defaults (18193/31108)
          # at the same moment; the gate's run takes a pair of its own so that a
          # collision reports as "port in use" on nobody's gate.
          A11Y_API_ADDR: "127.0.0.1:18197"
          A11Y_WEB_PORT: "31117"
        run: make a11y

  # Stage 10 — the i18n baseline (T1105). The same shape as the a11y job above,
  # for the same reason: this is not a static checker. It builds @post/web for
  # production, starts the shared Go API harness against a real PostgreSQL, and
  # drives a real Chromium over the core routes in BOTH preferences — the copy
  # switches, <html lang> follows it, the API requests are byte-identical across
  # locales, and scientific quantities and units render identically.
  #
  # It needs Go (the harness is a Go program), node + pnpm (next build) and a
  # PostgreSQL. It needs no step for the harness's own deps or for Chromium:
  # run-i18n.sh does both itself (npm ci against tests/web-smoke/package-lock.json,
  # then `npx playwright install chromium --only-shell`), exactly as run-a11y.sh
  # does. The two suites take different port pairs and share nothing writable.
  #
  # Wall clock on a warm tree, measured locally: SUITE PASSED in 70-73 s over
  # two independent runs (13 routes driven in both preferences, 12 with a
  # byte-identical API payload); the suite itself prints those per-phase costs
  # every run. On a cold runner the Chromium download and `next build` dominate,
  # as they do for a11y. It runs alongside the other jobs rather than after them.
  i18n:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pw
          POSTGRES_DB: post
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: "i18n: web workspace deps (pnpm via corepack, frozen lockfile)"
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: "i18n: language switching + wire identity (real Chromium, fixture data)"
        env:
          POSTGRES_TEST_ADMIN_URL: postgres://postgres:postgres_dev_pw@127.0.0.1:5432/post
          # Same reasoning as the a11y job's pair above: the suite pre-flights
          # its ports, and G2 re-runs these exact steps on a developer host
          # where a Worker may be driving the same suite on its defaults
          # (18194/31109) at the same moment.
          I18N_API_ADDR: "127.0.0.1:18198"
          I18N_WEB_PORT: "31118"
        run: make i18n
  security-master:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pw
          POSTGRES_DB: post
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "security-master: declare where the installers put their tools (go install -> GOPATH/bin, uv tool -> ~/.local/bin) so later steps find them"
        run: if [ -n "${GITHUB_PATH:-}" ]; then echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
      - name: "security-master: pnpm (corepack) — the SAST-Node and SBOM-Node rows run it, at the pin package.json declares"
        run: corepack enable pnpm
      - name: "security-master: uv — the bandit install and the SBOM-Python row run it"
        run: pip install uv==0.12.13
      # The two below are what this job's own first run found missing. The gate
      # runs every row it can and prints, per row, only the last 25 lines of
      # that row's log — so a row whose *script* shells out to a tool the
      # runner does not ship does not skip: it FAILs, and the reason is usually
      # above the 25-line window (this is how the owasp-smoke row failed with
      # nothing but `G3 security-smoke: 1 failure(s)` in the job output).
      # The install is guarded by a presence check rather than run
      # unconditionally, and that is what makes the step satisfiable wherever
      # this job runs: G2 runs CI's exact steps on a host that is not a GitHub
      # runner, and there `sudo` has no tty to prompt on — an unconditional
      # `sudo apt-get` failed the whole job before any security row ran, while
      # the tool it installs was already in /usr/bin. The guard asserts the same
      # thing (redis-cli is there) and only reaches for the package manager when
      # it is not.
      - name: "security-master: redis-cli — the owasp-smoke row resets and reads back its own edge counters through it before measuring the rate-limit boundary (installed only when the runner does not already ship it)"
        run: command -v redis-cli >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends redis-tools; }
      - name: "security-master: PyYAML — the deploy-template row's validator parses the staging compose file as YAML (the same install the spec-validation job does)"
        run: pip install pyyaml
      - name: "security-master: govulncheck (the vuln-go row's instrument; pinned here because nothing else pins it)"
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: "security-master: install every pinned scanner (make security-tools)"
        run: make security-tools
      - name: "security-master: the Master Security/Quality Gate (docs/23 §11)"
        run: bash tests/security/master-security-gate.sh
        env:
          POSTGRES_TEST_ADMIN_URL: postgres://postgres:postgres_dev_pw@127.0.0.1:5432/post
          POST_G3_REDIS_ADDR: 127.0.0.1:6379
