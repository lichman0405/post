# sqlc configuration (docs/68: pgx + sqlc).
#
# Schema input is the migration set itself (infra/migrations) — the generated
# code always matches what migrations actually ship, never a shadow copy of
# the canonical schema. Queries are explicit SQL under internal/persistence/queries.
#
# Generated code is CHECKED IN under internal/persistence/sqlc. After editing
# any query or migration, run:
#
#   sqlc generate          # v1.31.1 (pin recorded in infra/migrations/README.md)
#   tests/integration/check-sqlc-drift.sh
#
# The drift check regenerates and fails if the checked-in code does not match.
version: "2"
sql:
  - engine: "postgresql"
    schema: "infra/migrations"
    queries: "internal/persistence/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/persistence/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_interface: true
        omit_unused_structs: true

        # pgvector's `vector` is an extension type sqlc has no built-in
        # mapping for. Measured with sqlc v1.31.1 on the T0902 tree, before
        # this override existed:
        #
        #   SET embedding = @v::vector      -> "syntax error at or near" (no
        #                                      override)
        #   SET embedding = @v              -> same
        #   SELECT embedding                -> GENERATES pgvector.Vector and
        #                                      imports github.com/pgvector/
        #                                      pgvector-go, a dependency this
        #                                      module does not have
        #   SELECT embedding::text          -> fine, no override needed
        #
        # So the mapping below is what makes the WRITE generatable, and it
        # maps the column to string: the vector crosses the boundary as
        # pgvector's own text input syntax ("[0.1,0.2,...]"), which the
        # server parses via the explicit ::vector cast in the query. That
        # keeps a pgvector Go client out of go.mod entirely (T0902 decision,
        # recorded in the task result) — the column is read back the same
        # way, as embedding::text, so no query ever asks the driver to
        # understand the type. Note the override does NOT cover result
        # columns: SELECT embedding still emits pgvector.Vector even with
        # this in place, which is why every read of the column casts it to
        # text.
        overrides:
          - db_type: "vector"
            go_type: "string"
