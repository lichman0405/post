# Task state machine — rddev (T0009)
#
# The authoritative transition table for rddev's task state machine. The state
# set comes from docs/30_TASK_EXECUTION_STANDARD.md §2; the transition graph is
# derived from the Supervisor workflow in docs/30 §3-§6, docs/61, and the
# Supervisor charter (CLAUDE.md §4). It was not previously written down; T0009
# records it here so the enforcement is auditable (L1 decision, reversible —
# the Supervisor may amend this table in G2).
#
# Determinism rules:
#   - An illegal transition is REJECTED with a non-zero exit and a clear error;
#     the state file is left unchanged. rddev never coerces a transition.
#   - Every state change carries a run_id and a UTC timestamp and is appended
#     to the task's `history` array (append-only audit trail).
#   - State writes are atomic (temp file + fsync + rename) and serialized by an
#     exclusive lock (<state-file>.lock next to the targeted state file, or
#     .rddev/locks/task_status.lock for the default path). Two concurrent
#     writers cannot silently overwrite each other: the loser either waits and
#     then fails loudly on the (now stale) transition, or fails on the lock.
version: 1

states:
  - todo            # in the DAG, never dispatched; initial state (absent status == todo)
  - ready           # dependencies satisfied, cleared for dispatch
  - running         # a Worker has been dispatched (T0010 spawn)
  - worker_failed   # Worker crashed / budget exhausted (docs/62 §64)
  - verification    # RESULT collected, awaiting Supervisor G2
  - rejected        # G2 failed or collect validation failed; may re-enter ready
  - blocked         # SPEC_BLOCKED / ENV_BLOCKED (docs/30 §6); may re-enter ready
  - accepted        # G2 passed; awaiting commit/PR/G4 merge
  - merged          # terminal (docs/30 §5)

transitions:
  todo:          [ready, blocked]
  ready:         [running, blocked]
  running:       [verification, worker_failed, rejected]
  verification:  [accepted, rejected]
  worker_failed: [ready]
  rejected:      [ready]
  blocked:       [ready]
  accepted:      [merged]
  merged:        []                # terminal

command_mapping:
  # Which rddev subcommand performs which transition (T0009 surface).
  task ready:    [todo -> ready, blocked -> ready]   # deps must all be merged
  task verify:   [running -> verification]
  task accept:   [verification -> accepted]          # sets accepted_by_supervisor_at
  task reject:   [running -> rejected, verification -> rejected]
  task merged:   [accepted -> merged]                  # sets merged_at; Supervisor merge
                                                       # bookkeeping; T0012 may fold this
                                                       # into pr merge
  # worker spawn (T0010) performs ready -> running;
  # worker collect (T0011) performs running -> verification / worker_failed / rejected;
  # `blocked` is written by the Supervisor (no dedicated subcommand in T0009).

dependency_satisfied: "all of the task's dependencies have status == merged
  (docs/30 §3: dependencies are verified merged before a task starts)."
