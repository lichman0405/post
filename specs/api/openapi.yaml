openapi: 3.1.0
info:
  title: POST API
  version: 1.0.0-draft
  description: >-
    V1 semantic API. Governance-sensitive actions are explicitly separated from scientific
    state write operations. This file is a contract seed; implementation must keep it in sync.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /projects:
    get:
      summary: List accessible projects
      responses:
        '200': {description: OK}
    post:
      summary: Create project
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, visibility, purpose]
              properties:
                name: {type: string}
                slug: {type: string}
                visibility: {enum: [public, private]}
                purpose: {type: string}
                organization_id: {type: [string, 'null']}
      responses:
        '201': {description: Created}
  /projects/{projectId}:
    get:
      summary: Get project summary and governance state
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: OK}
  /projects/{projectId}/main:freeze:
    post:
      summary: Freeze main; governance action
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Frozen}
  /projects/{projectId}/forks:
    post:
      summary: Fork a research line into the caller's own space; the external contribution entry
      description: >-
        Resolves the create_branch cell for the caller's class
        (specs/policies/permissions-matrix.csv): the public_anonymous column denies it, a
        member's column allows it, and a non-member's cell is external_fork_only — the fork
        may be taken only of a PUBLIC project and only into the caller's own space (the fork
        project is the caller's personal project, so it grants no access to the parent and
        needs none). A non-member forking a private project is answered with the
        existence-hiding 404, never 403. The copy lands on a branch of the fork's own
        project, never on the fork's own main. Idempotent against canonical state, not
        against a remembered request key: a repeated request finds the existing fork and
        copies nothing twice. The fork project's SLUG is derived from the pair (parent,
        caller) and carries a digest of that pair, so no project a caller can name can deny
        them a fork of a readable one; its DISPLAY name is the parent's name or the
        caller's, unchanged.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source_branch_id:
                  type: [string, 'null']
                  description: >-
                    The parent line to fork; null or absent means the parent's canonical
                    line (main). A branch that is not in this project answers 404 — the
                    same answer for unknown and for foreign, so no existence leaks.
                name: {type: [string, 'null']}
                purpose: {type: [string, 'null']}
                visibility:
                  type: [string, 'null']
                  description: >-
                    The fork project's visibility; null or absent means private, fail
                    closed — the fork's content is the forker's until they publish it, and
                    publishing is a governance action, not a side effect of forking. A fork
                    of a project that is not PUBLIC MUST NOT be created public: the copy
                    carries the parent's content, and a contributor of a private project
                    holds allow on create_branch but deny on publish_private_to_public
                    (specs/policies/permissions-matrix.csv), so granting public here would hand
                    that class through a second door the capability the first one refuses.
                    This contract is deliberately narrower than the service, which today
                    honours public verbatim (internal/application/forks/service.go:821);
                    the route refuses public for a non-public parent rather than exposing
                    an undecided capability. Whether a fork may raise a copy of non-public
                    content into the open is an open permission-semantics decision
                    (tasks/decisions.md, 2026-09-19, the fork visibility section) — this
                    narrowing creates no rule, it applies the repository's own default-deny
                    (internal/authz/engine.go) pending that answer.
                  enum: [public, private]
                branch_name:
                  type: [string, 'null']
                  description: >-
                    The branch the copy lands on in the fork's project; null or absent
                    means fork/<source branch name>. Never the fork's own main: that line
                    is seeded at provisioning and the contribution is a distinct research
                    path (docs/09 §3).
      responses:
        '201':
          description: >-
            Fork created: the fork project, its branch, the content copy, and one lineage
            row (relation_type forked_from) with its audit row and its event, in one
            transaction.
        '200':
          description: >-
            Already forked: the caller's existing fork of this parent is returned; no
            project, branch or lineage row was created and no audit row or event written.
        '400': {description: "The request's shape is wrong (an unusable name or purpose), code VALIDATION_FAILED"}
        '401': {description: Authentication required — docs/04 §2 forks are for authenticated users}
        '403':
          description: >-
            Forbidden for this actor's class: create_branch is external_fork_only for a
            non-member, so a project the caller can read that is not PUBLIC is refused
            here. A non-member who cannot read the project answers 404 instead — the
            existence-hiding answer, resolved before any condition. A fork of a non-public
            parent that asks for visibility public is refused here as well — see the
            visibility field for why that one is fail-closed pending a decision.
        '404': {description: Unknown or unreadable project, or a source branch that is not in it}
        '409':
          description: >-
            The name the fork's project must have is held by a project that is not this
            (parent, caller) pair's recorded fork. Two situations collapse into this one
            answer and neither is claimed over the other, because the record cannot tell
            them apart: the holder is one of the caller's OWN projects (a fork request of
            theirs still in flight, or one of their projects that merely holds the name),
            or both the derived name and the pair's reserved name are held by others. The
            fork is refused rather than given a third, open-ended name: a project row
            cannot be deleted, so guessing here is how one pair ends up with two fork
            projects. A caller whose own in-flight request settles finds the fork on a
            retry.
        '503': {description: The store could not be reached; nothing is claimed about the outcome}

  /projects/{projectId}/branches:
    get:
      summary: List branches
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: OK}
    post:
      summary: Create research branch
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_ref, visibility]
              properties:
                name: {type: string}
                base_ref: {type: string}
                visibility: {enum: [public, private]}
                purpose: {type: [string, 'null']}
      responses:
        '201': {description: Created}
  /projects/{projectId}/branches/{branchId}/objects:
    post:
      summary: Create a scientific object version in a research branch
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_type, payload]
              properties:
                object_type: {type: string}
                payload: {type: object}
                schema_ref: {type: [string, 'null']}
      responses:
        '201': {description: Object version created}
  /projects/{projectId}/branches/{branchId}/objects/{objectId}:version:
    post:
      summary: Create next version of an object in branch
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - name: objectId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, patch]
              properties:
                expected_version: {type: integer}
                patch: {type: object}
      responses:
        '201': {description: New immutable version created}
  /projects/{projectId}/branches/{branchId}/relations:
    post:
      summary: Create typed, version-pinned RSG relation
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Relation created}
  /projects/{projectId}/branches/{branchId}/evidence-assertions:
    post:
      summary: Create evidence assertion
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Evidence assertion created}
  /projects/{projectId}/branches/{branchId}/blobs:request-upload:
    post:
      summary: Request signed upload for a scientific-context blob
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200': {description: Upload URL and provisional blob id}
  /projects/{projectId}/branches/{branchId}/blobs/{blobId}:finalize:
    post:
      summary: Finalize and attach uploaded blob to a scientific object
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - name: blobId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Attached}
  /projects/{projectId}/branches/{branchId}:validate:
    post:
      summary: Validate branch at PR/main/release/asset gate
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gate: {enum: [pr, main, release, asset]}
      responses:
        '200': {description: Validation report}
  /projects/{projectId}/pull-requests:
    get:
      summary: List pull requests
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: OK}
    post:
      summary: Open pull request with RSG diff
      description: >-
        One path for both classes. A member's open_pr cell is a plain allow; a non-member's
        is allow_from_fork, and the condition is the lineage — the source branch must
        belong to a fork of THIS project that THIS actor forked. The parent's own line,
        an unrelated project's, and somebody else's fork are refused with one answer, so
        none of the three leaks the others' existence. The database re-checks the same
        fact on any insert path (pull_request_fork_gate, infra/migrations/00086), and
        re-checks the semantic state too. A source branch whose recorded semantic state is
        unstructured_changes cannot open a formal PR (pull_request_semantic_gate,
        infra/migrations/00042, wire code BRANCH_UNSTRUCTURED_CHANGES): its content carries
        changes the platform cannot parse, and docs/16 §4 forbids proposing them until the
        required scientific semantics are filled — the file stays, the branch stays, and
        the proposal waits.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_branch_id, target_branch_id, title]
              properties:
                source_branch_id: {type: string}
                target_branch_id: {type: string}
                title: {type: string}
                body: {type: [string, 'null']}
      responses:
        '201': {description: PR opened}
        '400': {description: "The request's shape is wrong (an empty identity, an invalid title, an oversized body), code VALIDATION_FAILED"}
        '401': {description: Authentication required}
        '403': {description: "Forbidden for this actor's class (the open_pr cell): for a non-member, a source branch that is not a branch of their own fork of this project, code AUTH_FORBIDDEN"}
        '404': {description: Unknown or unreadable project, or a source or target branch that does not exist (code BRANCH_NOT_FOUND)}
        '409':
          description: >-
            The source branch cannot carry a formal proposal: its semantic state is
            unstructured_changes (00042, code BRANCH_UNSTRUCTURED_CHANGES), its lifecycle
            is merged or aborted (code BRANCH_NOT_ACTIVE), or it has no head state
            (code BRANCH_HEAD_MISSING).
        '503': {description: The store could not be reached; nothing is claimed about the outcome}

  /projects/{projectId}/pull-requests/{prId}/diff:
    get:
      summary: Get Research State Diff and raw file diff references
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PrId'
      responses:
        '200': {description: OK}
  /projects/{projectId}/pull-requests/{prId}/reviews:
    post:
      summary: Submit scientific/integrity review
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PrId'
      responses:
        '201': {description: Review submitted}
  /projects/{projectId}/pull-requests/{prId}:merge:
    post:
      summary: Merge approved PR into frozen main; governance action
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PrId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Merged}
  /projects/{projectId}/objects/{objectId}:abort-proposal:
    post:
      summary: Propose abort for object; main objects require PR flow
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: objectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '201': {description: Proposal or branch change created}
  /projects/{projectId}/releases:
    post:
      summary: Create immutable release from accepted main state
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Release created}
  /projects/{projectId}/assets:publish-preview:
    post:
      summary: Build publication impact/rights preview
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Preview}
  /projects/{projectId}/assets:publish:
    post:
      summary: Publish approved research asset; human governance action
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Asset version published}
  /projects/{projectId}/knowledge:publish-preview:
    post:
      summary: Build publication impact/rights preview for a knowledge object version
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Preview}
  /projects/{projectId}/knowledge:publish:
    post:
      summary: Publish approved knowledge object version; human governance action
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Knowledge object version published}
  /search:
    post:
      summary: Search Open R&D Network and generate evidence-backed answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string}
                filters: {type: object}
      responses:
        '200': {description: Search answer with cited entity versions}
  /search/{searchId}:start-project:
    post:
      summary: Create Draft Research Context from search answer
      parameters:
        - name: searchId
          in: path
          required: true
          schema: {type: string}
      responses:
        '201': {description: Draft project context created}
  /assets/{assetId}:
    get:
      security: []
      summary: Public/authorized asset page data
      parameters:
        - name: assetId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}
  /knowledge/{knowledgeId}:
    get:
      security: []
      summary: Published knowledge object plus origin/network evidence state
      parameters:
        - name: knowledgeId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}
  # --- Public syndication feeds (T1004) -----------------------------------
  # Read-only documents for feed readers rather than for the app: Atom 1.0
  # by default, RSS 2.0 when ?format=rss names it. All three carry
  # `security: []`, and an anonymous caller reaches them for the same reason
  # it reaches /assets/{assetId} — the /api/v1 guard challenges
  # state-changing methods only — so the handler, not the guard, decides
  # what that caller may see. Nothing in a document is derived from the
  # request: no rel="self" URL built from the Host header, and every URL is
  # built from the configured public origin.
  #
  # A target that does not exist, a private project, and a target with
  # nothing published are ONE answer: the same byte-identical 404. The
  # surface never confirms that a private target exists.
  #
  # Known deviation (recorded, not hidden): a knowledge feed omits the RSS
  # channel's required <link>, because no page renders a knowledge object
  # yet (T0805 owns that route) and the platform's rule is that a link to a
  # route that does not exist is a lie in the shape of an href. The item
  # identity is the <guid>, which is the publication's urn. The deviation
  # ends when the knowledge page exists.
  /feeds/projects/{projectId}:
    get:
      security: []
      summary: Atom/RSS feed of a public project's published versions
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/FeedFormat'
      responses:
        '200':
          description: The feed document; Atom unless ?format=rss
          content:
            application/atom+xml:
              schema: {type: string}
            application/rss+xml:
              schema: {type: string}
        '304':
          description: >-
            The caller's copy is current; carries ETag and Cache-Control and
            nothing else (If-None-Match).
        '400': {description: "The target id is malformed, or ?format names a format this API does not speak"}
        '404': {description: No such public feed}
  /feeds/assets/{assetId}:
    get:
      security: []
      summary: Atom/RSS feed of one public asset's published versions
      parameters:
        - name: assetId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/FeedFormat'
      responses:
        '200':
          description: The feed document; Atom unless ?format=rss
          content:
            application/atom+xml:
              schema: {type: string}
            application/rss+xml:
              schema: {type: string}
        '304':
          description: >-
            The caller's copy is current; carries ETag and Cache-Control and
            nothing else (If-None-Match).
        '400': {description: "The target id is malformed, or ?format names a format this API does not speak"}
        '404': {description: No such public feed}
  /feeds/knowledge/{objectId}:
    get:
      security: []
      summary: Atom/RSS feed of one knowledge object's public publications
      parameters:
        - name: objectId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/FeedFormat'
      responses:
        '200':
          description: >-
            The feed document; Atom unless ?format=rss. Entries carry no
            <link> (no page renders a knowledge object yet) — their identity
            is the urn in the entry id / RSS guid.
          content:
            application/atom+xml:
              schema: {type: string}
            application/rss+xml:
              schema: {type: string}
        '304':
          description: >-
            The caller's copy is current; carries ETag and Cache-Control and
            nothing else (If-None-Match).
        '400': {description: "The target id is malformed, or ?format names a format this API does not speak"}
        '404': {description: No such public feed}
  # --- Authentication (T0101) ---------------------------------------------
  # Session-cookie auth, not bearer: /auth/* establishes an opaque server-side
  # session (Redis) and returns a CSRF token bound to it. Everything under
  # /api/v1 that is neither an /auth/* route nor marked `security: []` is
  # default-deny — an unauthenticated write is 401 before routing, so a new
  # product route inherits the guard by being mounted in the subtree rather
  # than by opting in.
  /auth/signup:
    post:
      # Pre-authentication route: reachable without a session.
      security: []
      summary: Create an account with email and password; establishes a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, handle, display_name]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                handle: {type: string}
                display_name: {type: string}
      responses:
        '201': {description: Account created; session and CSRF cookies set}
        '409': {description: Email already registered (EMAIL_ALREADY_REGISTERED)}
        '415': {description: Unsupported media type}
        '429': {description: Rate limited; Retry-After set}
  /auth/login:
    post:
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200': {description: Signed in; session cookie set and csrf_token returned}
        '401':
          description: >-
            Credentials rejected. Unknown email and wrong password return a
            byte-identical envelope and perform the same key-derivation work,
            so the endpoint does not disclose whether an account exists.
        '429': {description: Rate limited per email and per IP; Retry-After set}
  /auth/logout:
    post:
      security: [{cookieAuth: []}]
      summary: Revoke the current session
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Session revoked server-side and cookie cleared}
        '401': {description: No valid session}
        '403': {description: Missing or invalid CSRF token}
  /auth/session:
    get:
      security: [{cookieAuth: []}]
      summary: Current session identity
      responses:
        '200': {description: The authenticated identity plus a fresh CSRF token}
        '401': {description: Not authenticated}
  /auth/oidc/authorize-url:
    get:
      security: []
      summary: Start an OIDC login flow, binding its state to this browser
      responses:
        '200':
          description: >-
            The provider URL to redirect the browser to, plus a state cookie
            that the callback is verified against.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: {type: string, format: uri}
        '501': {description: OIDC is not configured for this deployment}
  /auth/oidc/callback:
    get:
      security: []
      summary: OIDC provider redirect target; establishes the session
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string}
        - name: state
          in: query
          required: true
          schema: {type: string}
      responses:
        '302': {description: Session established; redirects to the web origin}
        '400':
          description: >-
            State mismatch or replay, missing or unverified email, or a token
            that failed signature/issuer/audience/time validation.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      # The opaque server-side session established by /auth/login, /auth/signup
      # or the OIDC callback. HttpOnly, SameSite=Lax, Secure outside dev.
      type: apiKey
      in: cookie
      name: post_session
  parameters:
    CsrfToken:
      # Session-bound, returned by /auth/session (and on login/signup) and
      # compared in constant time. Required on every state-changing request
      # that is authenticated by cookie rather than bearer token.
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string}
    BranchId:
      name: branchId
      in: path
      required: true
      schema: {type: string}
    PrId:
      name: prId
      in: path
      required: true
      schema: {type: string}
    FeedFormat:
      # Atom 1.0 is the default; `rss` selects RSS 2.0. A value naming
      # neither is refused (400) rather than silently served as Atom: a
      # reader that asked for RSS must be told it cannot have it, not handed
      # a document in a format it did not parse. This parameter is the only
      # way to choose — the Accept header is honored when it names exactly
      # one of the two media types, and quality-value negotiation is not
      # implemented.
      name: format
      in: query
      required: false
      schema: {type: string, enum: [atom, rss]}
