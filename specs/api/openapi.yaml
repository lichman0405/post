openapi: 3.1.0
info:
  title: POST API
  version: 1.0.0-draft
  description: >-
    V1 semantic API. Governance-sensitive actions are explicitly separated from scientific
    state write operations. This file is a contract seed; implementation must keep it in sync.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /projects:
    get:
      summary: List accessible projects
      responses:
        '200': {description: OK}
    post:
      summary: Create project
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, visibility, purpose]
              properties:
                name: {type: string}
                slug: {type: string}
                visibility: {enum: [public, private]}
                purpose: {type: string}
                organization_id: {type: [string, 'null']}
      responses:
        '201': {description: Created}
  /projects/{projectId}:
    get:
      summary: Get project summary and governance state
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: OK}
  /projects/{projectId}/main:freeze:
    post:
      summary: Freeze main; governance action
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Frozen}
  /projects/{projectId}/branches:
    get:
      summary: List branches
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: OK}
    post:
      summary: Create research branch
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_ref, visibility]
              properties:
                name: {type: string}
                base_ref: {type: string}
                visibility: {enum: [public, private]}
                purpose: {type: [string, 'null']}
      responses:
        '201': {description: Created}
  /projects/{projectId}/branches/{branchId}/objects:
    post:
      summary: Create a scientific object version in a research branch
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_type, payload]
              properties:
                object_type: {type: string}
                payload: {type: object}
                schema_ref: {type: [string, 'null']}
      responses:
        '201': {description: Object version created}
  /projects/{projectId}/branches/{branchId}/objects/{objectId}:version:
    post:
      summary: Create next version of an object in branch
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - name: objectId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, patch]
              properties:
                expected_version: {type: integer}
                patch: {type: object}
      responses:
        '201': {description: New immutable version created}
  /projects/{projectId}/branches/{branchId}/relations:
    post:
      summary: Create typed, version-pinned RSG relation
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Relation created}
  /projects/{projectId}/branches/{branchId}/evidence-assertions:
    post:
      summary: Create evidence assertion
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Evidence assertion created}
  /projects/{projectId}/branches/{branchId}/blobs:request-upload:
    post:
      summary: Request signed upload for a scientific-context blob
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200': {description: Upload URL and provisional blob id}
  /projects/{projectId}/branches/{branchId}/blobs/{blobId}:finalize:
    post:
      summary: Finalize and attach uploaded blob to a scientific object
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
        - name: blobId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Attached}
  /projects/{projectId}/branches/{branchId}:validate:
    post:
      summary: Validate branch at PR/main/release/asset gate
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gate: {enum: [pr, main, release, asset]}
      responses:
        '200': {description: Validation report}
  /projects/{projectId}/pull-requests:
    get:
      summary: List pull requests
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: OK}
    post:
      summary: Open pull request with RSG diff
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: PR opened}
  /projects/{projectId}/pull-requests/{prId}/diff:
    get:
      summary: Get Research State Diff and raw file diff references
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PrId'
      responses:
        '200': {description: OK}
  /projects/{projectId}/pull-requests/{prId}/reviews:
    post:
      summary: Submit scientific/integrity review
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PrId'
      responses:
        '201': {description: Review submitted}
  /projects/{projectId}/pull-requests/{prId}:merge:
    post:
      summary: Merge approved PR into frozen main; governance action
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PrId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': {description: Merged}
  /projects/{projectId}/objects/{objectId}:abort-proposal:
    post:
      summary: Propose abort for object; main objects require PR flow
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: objectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '201': {description: Proposal or branch change created}
  /projects/{projectId}/releases:
    post:
      summary: Create immutable release from accepted main state
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Release created}
  /projects/{projectId}/assets:publish-preview:
    post:
      summary: Build publication impact/rights preview
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses:
        '200': {description: Preview}
  /projects/{projectId}/assets:publish:
    post:
      summary: Publish approved research asset; human governance action
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Asset version published}
  /search:
    post:
      summary: Search Open R&D Network and generate evidence-backed answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string}
                filters: {type: object}
      responses:
        '200': {description: Search answer with cited entity versions}
  /search/{searchId}:start-project:
    post:
      summary: Create Draft Research Context from search answer
      parameters:
        - name: searchId
          in: path
          required: true
          schema: {type: string}
      responses:
        '201': {description: Draft project context created}
  /assets/{assetId}:
    get:
      security: []
      summary: Public/authorized asset page data
      parameters:
        - name: assetId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}
  /knowledge/{knowledgeId}:
    get:
      security: []
      summary: Published knowledge object plus origin/network evidence state
      parameters:
        - name: knowledgeId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}
  # --- Authentication (T0101) ---------------------------------------------
  # Session-cookie auth, not bearer: /auth/* establishes an opaque server-side
  # session (Redis) and returns a CSRF token bound to it. Everything under
  # /api/v1 that is neither an /auth/* route nor marked `security: []` is
  # default-deny — an unauthenticated write is 401 before routing, so a new
  # product route inherits the guard by being mounted in the subtree rather
  # than by opting in.
  /auth/signup:
    post:
      # Pre-authentication route: reachable without a session.
      security: []
      summary: Create an account with email and password; establishes a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, handle, display_name]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                handle: {type: string}
                display_name: {type: string}
      responses:
        '201': {description: Account created; session and CSRF cookies set}
        '409': {description: Email already registered (EMAIL_ALREADY_REGISTERED)}
        '415': {description: Unsupported media type}
        '429': {description: Rate limited; Retry-After set}
  /auth/login:
    post:
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200': {description: Signed in; session cookie set and csrf_token returned}
        '401':
          description: >-
            Credentials rejected. Unknown email and wrong password return a
            byte-identical envelope and perform the same key-derivation work,
            so the endpoint does not disclose whether an account exists.
        '429': {description: Rate limited per email and per IP; Retry-After set}
  /auth/logout:
    post:
      security: [{cookieAuth: []}]
      summary: Revoke the current session
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Session revoked server-side and cookie cleared}
        '401': {description: No valid session}
        '403': {description: Missing or invalid CSRF token}
  /auth/session:
    get:
      security: [{cookieAuth: []}]
      summary: Current session identity
      responses:
        '200': {description: The authenticated identity plus a fresh CSRF token}
        '401': {description: Not authenticated}
  /auth/oidc/authorize-url:
    get:
      security: []
      summary: Start an OIDC login flow, binding its state to this browser
      responses:
        '200':
          description: >-
            The provider URL to redirect the browser to, plus a state cookie
            that the callback is verified against.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url: {type: string, format: uri}
        '501': {description: OIDC is not configured for this deployment}
  /auth/oidc/callback:
    get:
      security: []
      summary: OIDC provider redirect target; establishes the session
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string}
        - name: state
          in: query
          required: true
          schema: {type: string}
      responses:
        '302': {description: Session established; redirects to the web origin}
        '400':
          description: >-
            State mismatch or replay, missing or unverified email, or a token
            that failed signature/issuer/audience/time validation.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      # The opaque server-side session established by /auth/login, /auth/signup
      # or the OIDC callback. HttpOnly, SameSite=Lax, Secure outside dev.
      type: apiKey
      in: cookie
      name: post_session
  parameters:
    CsrfToken:
      # Session-bound, returned by /auth/session (and on login/signup) and
      # compared in constant time. Required on every state-changing request
      # that is authenticated by cookie rather than bearer token.
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string}
    BranchId:
      name: branchId
      in: path
      required: true
      schema: {type: string}
    PrId:
      name: prId
      in: path
      required: true
      schema: {type: string}
